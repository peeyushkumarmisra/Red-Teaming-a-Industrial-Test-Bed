# =============================================================================
#  ci.yml - continuous integration on GitHub Actions
# -----------------------------------------------------------------------------
#  Runs on every push and pull request:
#  - build-test: builds every package in the official ros:jazzy image and runs all
#    unit tests (C++ gtest and Python pytest).
#  - lint: runs flake8 on all Python code (settings in .flake8).
#  Why it matters: the detection results are only worth something if anyone can
#  rebuild the exact code and see the same tests pass. Simulation runs (Gazebo) are
#  not part of CI; they are run by hand and logged with each release.
# =============================================================================

name: ci

on:
  push:
  pull_request:

jobs:
  # Build and unit tests in the same ROS 2 Jazzy image family as the containers.
  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      # rosdep installs every system dependency declared in the package.xml files. ikpy has
      # no rosdep key, so it is pinned and installed with pip (same version as the robot
      # image).
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip libgtest-dev
          pip3 install --break-system-packages ikpy==4.5.0
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  # Python style check; runs without ROS, so it is fast.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 src
