name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip libgtest-dev openssl
          pip3 install --break-system-packages ikpy==4.5.0 pymodbus==3.6.9
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 src plc
      - run: docker compose config --quiet

  plc-st:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build matiec and compile the ST program
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake flex bison
          git clone --depth 1 https://github.com/beremiz/matiec /tmp/matiec
          cd /tmp/matiec && autoreconf -i && ./configure && make -j2
          mkdir -p /tmp/iecout
          ./iec2c -I lib -T /tmp/iecout "$GITHUB_WORKSPACE/plc/cell.st"