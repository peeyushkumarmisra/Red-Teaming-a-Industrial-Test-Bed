# ==================================================================================================
#  ci.yml - continuous integration on GitHub Actions
# --------------------------------------------------------------------------------------------------
# Runs on every push and pull request:
#   - build-test: builds every package in the official ros:jazzy image and runs all unit tests
#   - lint: runs flake8 on all Python code (settings in .flake8).
# Why it needed: Detection results are only worth something if it can be rebuild the exact code 
# and see the same tests pass. Simulation runs (Gazebo) are not part of CI as they are run by me and 
# logged with each release.
# ==================================================================================================

name: ci

# Run these checks automatically whenever new code is pushed  or someone do a pull request.
on:
  push:
  pull_request:

jobs:
    build-test: # Job 1: Build & Test the Robotics Code (fresh Ubuntu 24.04 with ROS 2 pre-installed)
        runs-on: ubuntu-24.04
        container: ros:jazzy
        steps:
            # 1. Download the project code into this temporary computer
            - name: Download repository code
              uses: actions/checkout@v4

            # 2. Install all required ROS packages and build tools
            # rosdep installs every system dependency declared in the package.xml files. ikpy has no 
            # rosdep key, so it is pinned and installed with pip (same version as the robot image).
            - name: Install dependencies
              shell: bash
              run: |
                  apt-get update
                  apt-get install -y python3-colcon-common-extensions python3-pip libgtest-dev
                  pip3 install --break-system-packages ikpy==4.5.0
                  rosdep update
                  rosdep install --from-paths src --ignore-src -y
            # 3. Compile the workspace in fast "Release" mode to catch build errors
            - name: Build
              shell: bash
              run: |
                  source /opt/ros/jazzy/setup.bash
                  colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
            # 4. Run all automated tests and show detailed results if anything fails
            - name: Test
              shell: bash
              run: |
                  source /opt/ros/jazzy/setup.bash
                  colcon test --event-handlers console_direct+
                  colcon test-result --verbose

    lint: # Job 2: Check Python Code Formatting (runs without ROS, so its fast)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4 # Downloads the project code
            - uses: actions/setup-python@v5 # Sets up Python 3.12
              with:
                  python-version: "3.12"
            - run: pip install flake8 # Installs the style checker tool (Flake8)
            - run: flake8 src # Scans the 'src' folder to make sure code follows our formatting rules
