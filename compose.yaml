name: thesis

x-ros-env: &ros-env
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

x-sros2: &sros2
  ROS_SECURITY_KEYSTORE: /keystore
  ROS_SECURITY_ENABLE: "true"
  ROS_SECURITY_STRATEGY: Enforce

x-cell-and-monitor-dds: &cell-and-monitor-dds
  CYCLONEDDS_URI: '<CycloneDDS><Domain Id="10"><General><Interfaces><NetworkInterface address="10.203.10.0"/></Interfaces></General></Domain><Domain Id="20"><General><Interfaces><NetworkInterface address="10.203.20.0"/></Interfaces></General></Domain></CycloneDDS>'

x-cell-dds: &cell-dds
  CYCLONEDDS_URI: '<CycloneDDS><Domain Id="any"><General><Interfaces><NetworkInterface address="10.203.10.0"/></Interfaces></General></Domain></CycloneDDS>'

x-monitor-dds: &monitor-dds
  CYCLONEDDS_URI: '<CycloneDDS><Domain Id="any"><General><Interfaces><NetworkInterface address="10.203.20.0"/></Interfaces></General></Domain></CycloneDDS>'

x-robot-image: &robot-image
  image: thesis/robot:dev
  pull_policy: never
  init: true
  stdin_open: true
  tty: true
  shm_size: 512mb

services:
  robot:
    build:
      context: .
      dockerfile: docker/robot.Dockerfile
    image: thesis/robot:dev
    container_name: thesis-robot
    hostname: robot
    init: true
    shm_size: 1gb
    stdin_open: true
    tty: true
    environment:
      <<: [*ros-env, *sros2, *cell-and-monitor-dds]
      ROS_DOMAIN_ID: "10"
      ROS_SECURITY_ENCLAVE_OVERRIDE: /cell/robot
      DISPLAY: host.docker.internal:0.0
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      PLC_HOST: "10.203.10.66"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/ws/src
      - robot_build:/ws/build
      - robot_install:/ws/install
      - robot_log:/ws/log
      - ./data:/ws/data
      - ./plc:/ws/plc:ro
      - ./keystore/enclaves/cell/robot:/keystore/enclaves/cell/robot:ro
    networks:
      control_net:
        ipv4_address: 10.203.10.10
      monitor_net:
        ipv4_address: 10.203.20.10

  plc:
    build:
      context: .
      dockerfile: docker/openplc.Dockerfile
    image: thesis/openplc:dev
    container_name: thesis-plc
    hostname: plc
    init: true
    volumes:
      - ./plc:/opt/openplc/webserver/st_files/cell:ro
    networks:
      control_net:
        ipv4_address: 10.203.10.20
      monitor_net:
        ipv4_address: 10.203.20.20

  attacker:
    <<: *robot-image
    container_name: thesis-attacker
    hostname: attacker
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      <<: [*ros-env, *sros2, *cell-dds]
      ROS_DOMAIN_ID: "10"
      ROS_SECURITY_ENCLAVE_OVERRIDE: /attacker/implant
      PLC_HOST: "10.203.10.20"
    volumes:
      - ./src:/ws/src:ro
      - robot_install:/ws/install:ro
      - ./data/cell:/ws/data/cell
      - ./keystore/loot:/keystore:ro
    networks:
      control_net:
        ipv4_address: 10.203.10.66

  ids:
    build:
      context: .
      dockerfile: docker/ids.Dockerfile
    image: thesis/ids:dev
    container_name: thesis-ids
    hostname: ids
    init: true
    stdin_open: true
    tty: true
    environment:
      <<: [*ros-env, *sros2, *monitor-dds]
      ROS_DOMAIN_ID: "20"
      ROS_SECURITY_ENCLAVE_OVERRIDE: /monitor/ids
      PLC_HOST: "10.203.20.20"
    volumes:
      - ./src:/ws/src
      - ids_build:/ws/build
      - ids_install:/ws/install
      - ids_log:/ws/log
      - ./data:/ws/data
      - ./keystore/enclaves/monitor/ids:/keystore/enclaves/monitor/ids:ro
    networks:
      monitor_net:
        ipv4_address: 10.203.20.30

  keystore:
    image: thesis/ids:dev
    pull_policy: never
    profiles: ["tools"]
    network_mode: none
    environment:
      PYTHONPATH: /ws/src/ids_security
    command: ["python3", "-m", "ids_security.make_keystore", "--out", "/keystore"]
    volumes:
      - ./src:/ws/src:ro
      - ./keystore:/keystore

  eng-ws:
    <<: *robot-image
    container_name: thesis-eng-ws
    hostname: eng-ws
    command: ["sleep", "infinity"]
    environment:
      <<: *ros-env
      PLC_WEB: "http://10.203.10.20:8080"
    volumes:
      - ./src:/ws/src:ro
      - robot_install:/ws/install:ro
      - ./plc:/ws/plc:ro
    networks:
      ops_net:
        ipv4_address: 10.203.30.90
      control_net:
        ipv4_address: 10.203.10.90

  hmi:
    <<: *robot-image
    container_name: thesis-hmi
    hostname: hmi
    command: ["python3", "-m", "ot_bridge.hmi", "--plc-host", "10.203.10.20"]
    environment:
      <<: *ros-env
      PYTHONPATH: /ws/src/ot_bridge
    ports:
      - "8081:8081"
    volumes:
      - ./src:/ws/src:ro
    networks:
      control_net:
        ipv4_address: 10.203.10.80

  range:
    <<: *robot-image
    container_name: thesis-range
    hostname: range
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      <<: [*ros-env, *sros2, *monitor-dds]
      ROS_DOMAIN_ID: "20"
      ROS_SECURITY_ENCLAVE_OVERRIDE: /monitor/ids
    volumes:
      - ./src:/ws/src:ro
      - robot_install:/ws/install:ro
      - ./data:/ws/data
      - ./keystore/enclaves/monitor/ids:/keystore/enclaves/monitor/ids:ro
    networks:
      monitor_net:
        ipv4_address: 10.203.20.90
      ops_net:
        ipv4_address: 10.203.30.91

networks:
  control_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.203.10.0/24
  monitor_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.203.20.0/24
  ops_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.203.30.0/24

volumes:
  robot_build:
  robot_install:
  robot_log:
  ids_build:
  ids_install:
  ids_log: