encoding:
  q_scale: 10000.0
  q_offset: 3.3
  description: joint angle register = round((q + q_offset) * q_scale), unsigned 16-bit

holding_registers:
  0: sequence_number
  1: program_step_index
  2: motion_kind
  3: move_duration_ms
  4: payload_context
  5: gripper_command
  6: completed_passes
  7: program_finished
  10: q_target_a1
  11: q_target_a2
  12: q_target_a3
  13: q_target_a4
  14: q_target_a5
  15: q_target_a6
  16: q_target_a7
  40: status_robot_halted
  41: status_step_ack
  42: status_reference_seq

coils:
  0: program_run
  8: ids_alarm
  9: safe_stop

motion_kind:
  0: idle
  1: move
  2: dwell