# =============================================================================
#  campaign.yaml - every experiment run, by name
# -----------------------------------------------------------------------------
#  defaults:  shared by all runs (friction wear, endless pick-and-place, 5 kg part,
#             seeds 1-3).
#  scenarios: single runs (smoke test, calibration, nominal).
#  families:  one run per joint (step_a1..step_a7, ramp_a1..ramp_a7).
#  campaign:  the default order for `ros2 run ids_bringup run_campaign`
#             (45 runs: nominal x 3, then step and ramp on 7 joints x 3 seeds).
#  Times are seconds after the first trusted reference. Attacks start at 120 s, well
#  after wear begins at 30 s, so the IDS must see the attack through the wear.
#  v1.2 measured only nominal and step_a4 with seed 1 (see docs/v1.2.md).
# =============================================================================

defaults:
  friction_profile: wear
  planner:
    cycles: 0
    payload_mass: 5.0
  seeds: [1, 2, 3]

scenarios:
  # 60 s plumbing check (IDS not needed).
  smoke:
    duration: 60.0
    seeds: [1]
  # Constant friction for 130 s: 2 s warm-up + 120 s recorded by the IDS.
  calibration:
    friction_profile: nominal
    duration: 130.0
    seeds: [1]
  # No attack for 600 s under wear: measures false alarms.
  nominal:
    duration: 600.0

families:
  # 0.02 rad setpoint step for 10 s: the abrupt attack (dissertation's case).
  step:
    duration: 180.0
    joints: [1, 2, 3, 4, 5, 6, 7]
    attack:
      kind: step
      magnitude: 0.02
      start: 120.0
      duration: 10.0
  # 0.001 rad/s for 30 s (0.03 rad in total): the slow, stealthy attack.
  ramp:
    duration: 180.0
    joints: [1, 2, 3, 4, 5, 6, 7]
    attack:
      kind: ramp
      magnitude: 0.001
      start: 120.0
      duration: 30.0

campaign: [nominal, step, ramp]
