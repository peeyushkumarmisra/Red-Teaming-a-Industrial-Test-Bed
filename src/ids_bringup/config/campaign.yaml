defaults:
  friction_profile: wear
  planner:
    cycles: 0
    payload_mass: 5.0
  seeds: [1, 2, 3]

scenarios:
  smoke:
    duration: 60.0
    seeds: [1]
  calibration:
    friction_profile: nominal
    duration: 130.0
    seeds: [1]
  nominal:
    duration: 600.0
  coordinated_a2a4:
    duration: 180.0
    attacks:
      - {kind: coordinated, joints: [2, 4], magnitudes: [0.005, 0.005], start: 120.0,
         duration: 10.0}
  step_a4_cover:
    duration: 180.0
    cover_torque: true
    attacks:
      - {kind: step, joint: 4, magnitude: 0.02, start: 120.0, duration: 10.0}

families:
  step:
    duration: 180.0
    joints: [1, 2, 3, 4, 5, 6, 7]
    attack:
      kind: step
      magnitude: 0.02
      start: 120.0
      duration: 10.0
  ramp:
    duration: 180.0
    joints: [1, 2, 3, 4, 5, 6, 7]
    attack:
      kind: ramp
      magnitude: 0.001
      start: 120.0
      duration: 30.0
  sine:
    duration: 180.0
    joints: [4]
    attack:
      kind: sine
      magnitude: 0.01
      frequency: 0.5
      start: 120.0
      duration: 10.0
  scaling:
    duration: 180.0
    joints: [4]
    attack:
      kind: scaling
      magnitude: 1.05
      start: 120.0
      duration: 10.0
  freeze:
    duration: 180.0
    joints: [4]
    attack:
      kind: freeze
      start: 120.0
      duration: 10.0
  replay:
    duration: 180.0
    joints: [4]
    attack:
      kind: replay
      lag: 4.0
      start: 120.0
      duration: 10.0
  delay:
    duration: 180.0
    joints: [4]
    attack:
      kind: delay
      lag: 0.2
      start: 120.0
      duration: 10.0
  noise:
    duration: 180.0
    joints: [4]
    attack:
      kind: noise
      magnitude: 0.002
      start: 120.0
      duration: 10.0
  drift_mimic:
    duration: 180.0
    joints: [4]
    attack:
      kind: drift_mimic
      magnitude: 0.002
      start: 120.0
      duration: 30.0

sweeps:
  step_sweep:
    duration: 180.0
    joints: [1, 2, 3, 4, 5, 6, 7]
    magnitudes: [0.0025, 0.005, 0.01, 0.02]
    attack:
      kind: step
      start: 120.0
      duration: 10.0
  ramp_sweep:
    duration: 180.0
    joints: [1, 2, 3, 4, 5, 6, 7]
    magnitudes: [0.00025, 0.0005, 0.001]
    attack:
      kind: ramp
      start: 120.0
      duration: 30.0

campaign: [nominal, step, ramp]