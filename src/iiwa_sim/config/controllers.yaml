controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    reference_tracking_controller:
      type: iiwa_controllers/ReferenceTrackingController

reference_tracking_controller:
  ros__parameters:
    joints:
      - joint_a1
      - joint_a2
      - joint_a3
      - joint_a4
      - joint_a5
      - joint_a6
      - joint_a7
    tip_joint: joint_a7
    halt_on_alarm: false
    tick_clock: true
    reference_hold: 0.05
    reference_timeout: 0.5
    resume_time: 0.5
    encoder_bits: 20
    velocity_noise: 0.001
    noise_seed: 1
    measurement_decimation: 10
    reference_topic: /robot/reference
    measurement_topic: /robot/measurement
    alarm_topic: /ids/alarm