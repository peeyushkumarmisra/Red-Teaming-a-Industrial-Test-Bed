/**:
  ros__parameters:
    use_sim_time: true
    run_mode: armed
    calibration_file: /ws/data/calibration/ids_thesis.yaml
    calibration_duration: 120.0
    arm_after_calibration: false
    exit_after_calibration: false
    warmup: 2.0
    model_urdf: ""
    input_source: commanded_torque
    estimator_mode: thesis
    detector:
      false_alarm_budget_per_hour: 0.125
      debounce: 5
      latch: true